<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #ACFF9E; 
      margin: 0; 
      font-family: "Times New Roman", serif; 
      position: relative; 
      background-image: url('./assets/images/apple3.0/tile.png'); 
      background-repeat: repeat; 
      background-size: 10vw; /* Use vw for a relative background tile size */
      -webkit-font-smoothing: none; 
      -moz-osx-font-smoothing: grayscale; 
    }

    .background-image {
      position: absolute; 
      top: 30%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: -1; 
      width: 50%; /* Relative width */
      height: 120vh; /* Relative height based on viewport height */
    }

    .side-banner {
      position: absolute;
      top: 15%; 
      bottom: 0;
      width: 10%;  /* Use percentage for width */
      height: 60vh; /* Use vh for height to make it relative to the viewport */
      z-index: 0;
    }

    .left-side-banner {
      left: 25%;
      background-image: url('./assets/images/apple3.0/sidebanner.png');
      background-size: cover; 
      background-repeat: no-repeat;
    }

    .right-side-banner {
      right: 25%;
      background-image: url('./assets/images/apple3.0/sidebanner2.png');
      background-size: cover;
      background-repeat: no-repeat;
    }

    .banner-container {
      position: relative;
      width: 100%;
      height: auto;
    }

    .banner {
      width: 50%; /* Relative width */
      position: relative; 
      top: 0;
      left: 25%;  /* Relative positioning based on parent container */
      z-index: 2; 
    }

    /* Logo styling */
    .logo {
      position: absolute;
      top: 30%; 
      left: 28%; 
      z-index: 3;
      width: 15vw; /* Use viewport width for logo size */
    }

    .page-content {
      text-align: center;
      padding-top: 10vh;  /* Use vh for padding based on viewport height */
      position: relative;
      z-index: 4; 
    }

    .footer-col-3 {
      text-align: center; 
      padding: 2em; /* Use em for padding to make it relative to font size */
    }

    .second-banner-container {
      position: relative;
      width: 50%; 
      left: 25%; 
      margin-top: 30vh; /* Use vh for margin to make it relative to viewport height */
    }

    .second-banner {
      width: 100%; 
      position: relative;
      z-index: 1;
    }

    .team-text {
      position: absolute;
      bottom: 2vh;  /* Use vh for positioning relative to the viewport height */
      left: 15%; 
      transform: translateX(-50%); 
      font-size: 1.5em; /* Reduced font size to make it smaller */
      color: rgb(0, 0, 0); 
      font-weight: bold; 
      z-index: 2; 
    }

    h1 {
      text-align: center; 
      font-size: 1.5em;  /* Reduced font size to make it smaller */
      font-weight: bold; 
      margin: 0;
      margin-top: 15vh;  /* Use vh for margin */
    }

    h3 {
      margin-top: 2vh;  /* Use vh for margin */
    }

    .home {
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100%; 
    }

    .home a {
      display: inline-block;
      width: 15vw;  /* Reduced width to make it smaller */
      height: 6vw; /* Reduced height to make it smaller */
      text-align: center;
      position: relative;
    }

    .home img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
    }
  </style>
</head>
<body>
  <div class="background-image">
    <img src="./assets/images/apple3.0/background.png" alt="Background Image" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <div class="side-banner left-side-banner"></div>
  <div class="side-banner right-side-banner"></div>

  <div class="banner-container">
    <img src="./assets/images/apple3.0/banner.png" alt="Banner" class="banner">
    <h1><img src="./assets/images/apple3.0/Logo.png" alt="Logo" class="logo"></h1>
  </div>

  <h1>get ready to delve deep into the psyche of the elf</h1>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      <div class="home">
        <a class="post-link" href="https://www.youtube.com/watch?v=rUtFe5jPfrY">
          <img src="./assets/images/apple3.0/download.png" alt="Download">
        </a>
      </div>
    </div>
  </main>

  <div class="second-banner-container">
    <img src="./assets/images/apple3.0/banner.png" alt="Second Banner" class="second-banner">
    <div class="team-text">
      <p>@TeamGoldenApple 2009</p>
    </div>
  </div>

</body>
</html>
